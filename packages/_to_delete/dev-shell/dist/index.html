<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>awm dev-shell</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <aside id="rail">
    <h1>stripes</h1>
    <ul id="stripe-list">
      <li class="placeholder">loading…</li>
    </ul>
    <button id="refresh" title="re-fetch /hub/stripes">↻ refresh</button>
    <div id="operator-row" title="operator identity (from awm_as cookie)">
      <span class="label">operator</span>
      <span id="operator">…</span>
    </div>
  </aside>
  <main id="stage">
    <div id="empty">
      <h2>pick a stripe →</h2>
      <p>Each stripe runs at its own URL prefix and is mounted here in an
         iframe. Open the iframe URL directly to inspect; the dev-shell is
         a thin browser over <code>/hub/stripes</code>.</p>
    </div>
    <iframe id="frame" hidden></iframe>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
