<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>hello stripe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f1115; --panel: #161a21; --fg: #e6e8ec; --muted: #8a93a0;
      --accent: #7aa2f7; --line: #232936;
    }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      background: var(--bg); color: var(--fg);
      display: grid; place-items: center;
    }
    main {
      padding: 32px 40px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); min-width: 360px;
    }
    h1 { margin: 0 0 4px; font-size: 18px; }
    p.lede { color: var(--muted); margin-top: 0; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
    input {
      width: 100%; padding: 6px 8px; border-radius: 4px;
      border: 1px solid var(--line); background: var(--bg); color: var(--fg);
      font: inherit;
    }
    button {
      margin-top: 14px; padding: 6px 14px; border-radius: 4px;
      border: 1px solid var(--accent); background: transparent; color: var(--accent);
      cursor: pointer; font: inherit;
    }
    button:hover { background: rgba(122,162,247,0.08); }
    pre {
      background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
      padding: 10px; margin-top: 14px; overflow-x: auto;
      color: var(--fg); font-family: ui-monospace, monospace;
    }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>hello stripe</h1>
    <p class="lede">round-trip through the hub-proxied backend</p>
    <label for="msg">message</label>
    <input id="msg" value="alpha" />
    <button id="send">echo</button>
    <pre id="out">(pending)</pre>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
