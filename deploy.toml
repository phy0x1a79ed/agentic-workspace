# awm's deploy config, read by the routine plugin's deploy engine from the
# commit it is about to land (docs/redux/routines.md R27, R31, R32).

[deploy]
# Only the dists the batch touched, only their smoke tests. Exit 5 (nothing
# collected) counts as a pass.
check = 'awm/gateway/scripts/run-tests.sh --smoke --changed "$AWM_DEPLOY_BASE"'
check_timeout = 60

[refresh]
# A restart hook would restart the routine plugin that runs this deploy, so a
# supervising session runs `awm deploy` and watches the services come back (R32).
kind = "queue"
prompt = """Update this node's awm checkout to the new release and restart it, \
as FEDERATION.md § Updating a node says: fetch and reset onto awm/release, \
`git clean -fd` (never -x), then `awm deploy`. Confirm every enabled service \
came back. If one did not, fix it before you stop."""

[fleet]
# The homebase first. A node fails, the rollout stops before the rest.
canonical = "mizar"
nodes = ["mizar", "alcor", "altair", "capella"]

[fixer]
peer = "mizar"
