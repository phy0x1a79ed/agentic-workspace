# awm's deploy config, read by the land batch (scripts/land.sh) from the tree it is
# about to land (docs/redux/routines.md R27, R31, R32). It names no host: each
# node's install config lists the fleet (fleet.md R140).

[deploy]
# Only the dists the batch touched, only their smoke tests. Exit 5 (nothing
# collected) counts as a pass. A change to a shared component selects every
# dist, which takes minutes, so the budget covers a full smoke run.
check = 'scripts/run-tests.sh --smoke --changed "$AWM_DEPLOY_BASE"'
check_timeout = 600

[promote]
# The canonical repo's GitHub remote takes each release, fast-forward only
# (install.md R114).
backup = "github"

[refresh]
# The land rollout (scripts/land.sh) runs these on each node, in the checkout awm
# runs from: sync moves it to the release, then node-refresh.sh deploys it and
# checks every enabled service, with no agent.
sync = "scripts/refresh-checkout.sh"
command = "scripts/node-refresh.sh"

[artifacts]
# Built files the release pins. Before a push node refreshes, the landing node
# pushes each into the node's artifact store, when the install config names one
# (install.md R115 item 4). Each core plugin core/plugins/<name> adds its pin,
# "scripts/plugins/<name>.pin", in the commit that adds the plugin: scripts/release-plugins.sh
# refuses a plugin whose pin is not listed here, and the refresh writes the pin.
pins = ["scripts/core.pin", "scripts/pages.pin", "awm/services/trilium/server.pin", "scripts/plugins/browser.pin", "scripts/plugins/rlm-browser.pin", "scripts/plugins/channel.pin", "scripts/plugins/social.pin", "scripts/plugins/dev.pin", "scripts/plugins/dsh.pin", "scripts/plugins/fileviewer.pin", "scripts/plugins/routine.pin", "scripts/plugins/telemetry.pin", "scripts/plugins/telemetry-node.pin", "scripts/plugins/cch.pin", "scripts/plugins/mic.pin", "scripts/plugins/dvc.pin", "scripts/plugins/operations.pin", "scripts/plugins/auth.pin", "scripts/plugins/kb.pin", "scripts/plugins/scopes.pin"]
# Runs in the batch's temp tree after the merge. It rebuilds each stale pin into the landing
# node's artifact store, and the engine commits the pins it rewrote as `deploy: refresh pins`.
# A cold musl build takes minutes, so it has its own budget.
refresh = "scripts/refresh-pins.sh"
refresh_timeout = 1800
