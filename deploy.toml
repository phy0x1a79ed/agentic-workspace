# awm's deploy config, read by node rollout (scripts/rollout.sh) from the release it
# deploys (docs/redux/routines.md R27, R31, R32). It names no host: each node's
# install config lists the fleet (fleet.md R140).

[refresh]
# Node rollout runs these on each node, in the checkout awm
# runs from: sync moves it to the release, then node-refresh.sh deploys it and
# checks every enabled service, with no agent.
sync = "scripts/refresh-checkout.sh"
command = "scripts/node-refresh.sh"

[artifacts]
# Built files the release pins. Before a push node refreshes, the rollout
# pushes each into the node's artifact store, when the install config names one
# (install.md R115 item 4). Each core plugin core/plugins/<name> adds its pin,
# "scripts/plugins/<name>.pin", in the commit that adds the plugin: scripts/release-plugins.sh
# refuses a plugin whose pin is not listed here, and the refresh writes the pin.
pins = ["scripts/core.pin", "scripts/pages.pin", "scripts/models.pin", "awm/services/trilium/server.pin", "scripts/plugins/browser.pin", "scripts/plugins/rlm-browser.pin", "scripts/plugins/channel.pin", "scripts/plugins/social.pin", "scripts/plugins/productivity.pin", "scripts/plugins/seats.pin", "scripts/plugins/dev.pin", "scripts/plugins/dsh.pin", "scripts/plugins/fileviewer.pin", "scripts/plugins/routine.pin", "scripts/plugins/telemetry.pin", "scripts/plugins/telemetry-node.pin", "scripts/plugins/cch.pin", "scripts/plugins/mic.pin", "scripts/plugins/dvc.pin", "scripts/plugins/operations.pin", "scripts/plugins/auth.pin", "scripts/plugins/kb.pin", "scripts/plugins/scopes.pin", "scripts/plugins/reflection.pin"]
