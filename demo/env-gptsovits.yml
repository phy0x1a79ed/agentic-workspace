# GPT-SoVITS sidecar env.
#
# Setup (the repo's own setup is heavy; we install the inference path only):
#   mamba env create -f demo/env-gptsovits.yml
#   mamba run -n awm-gptsovits pip install --extra-index-url https://download.pytorch.org/whl/cu121 torch==2.2.2 torchaudio==2.2.2
#   git clone https://github.com/RVC-Boss/GPT-SoVITS demo/voices/native-eval/_repos/GPT-SoVITS
#   mamba run -n awm-gptsovits pip install -r demo/voices/native-eval/_repos/GPT-SoVITS/requirements.txt
#   mamba run -n awm-gptsovits pip install fastapi 'uvicorn[standard]' huggingface_hub
#
# Pretrained weights (~2 GB, on first run):
#   mamba run -n awm-gptsovits python -c "from huggingface_hub import snapshot_download; \
#       snapshot_download('lj1995/GPT-SoVITS', local_dir='demo/voices/native-eval/_repos/GPT-SoVITS/GPT_SoVITS/pretrained_models')"
#
# Run:
#   mamba run -n awm-gptsovits python demo/tts_gptsovits_service.py --port 7841
name: awm-gptsovits
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - git
  - ffmpeg
  - pip:
      - 'pip<24.1'
