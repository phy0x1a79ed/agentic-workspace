# Style-Bert-VITS2 sidecar env.
#
# Setup (the version pins after style-bert-vits2 matter — see Pin notes below):
#   mamba env create -f demo/env-sbv2.yml
#   mamba run -n awm-sbv2 pip install --extra-index-url https://download.pytorch.org/whl/cu121 torch==2.2.2 torchaudio==2.2.2
#   mamba run -n awm-sbv2 pip install style-bert-vits2 fastapi 'uvicorn[standard]' huggingface_hub
#   mamba run -n awm-sbv2 pip install 'transformers==4.46.3' sentencepiece 'numpy<2'
#
# Pin notes (validated 2026-06-01 on capella):
#   - torch 2.2.2 is what style-bert-vits2's pretrained-loader path expects.
#   - transformers >=5 drops torch <2.4 → DebertaV2Model import fails.
#   - transformers >=4.49 added a CVE check that refuses torch.load on torch <2.6.
#     4.46.3 is the last release with neither restriction.
#   - DebertaV2Tokenizer requires the SentencePiece native lib, not a transitive dep.
#   - numpy >=2 has an ABI mismatch with torch 2.2 (the "_ARRAY_API not found" warning
#     escalates to a load failure on some kernels).
#
# Run:
#   demo/restart-tts-sbv2.sh                    # canonical launcher
#   # or directly:
#   mamba run -n awm-sbv2 python demo/tts_sbv2_service.py --port 7843
#
# Model download (GLaDOS checkpoint, on first run):
#   handled by the sidecar via huggingface_hub.snapshot_download into
#   demo/voices/native-eval/_models/sbv2/glados/  (~200 MB)
name: awm-sbv2
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - 'pip<24.1'
