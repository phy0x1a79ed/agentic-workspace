# Installed by scripts/sirius/provision.sh. Shared by every proxied location
# in nexus.conf: the awm edge (httpsfront, AWM_EDGE_TLS=0) listens plain HTTP
# on loopback and trusts X-Forwarded-* from 127.0.0.1 only.
proxy_pass http://127.0.0.1:8444;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
# $remote_addr is the visitor after cloudflare-real-ip.conf, and the edge's
# login lockout keys on it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
client_max_body_size 64m;
