# Installed by scripts/sirius/provision.sh. The only vhost on the box.
# Cloudflare terminates public TLS and reaches this origin with the origin
# certificate in /etc/awm/. real_ip ranges come from cloudflare-real-ip.conf,
# regenerated by provision.sh from the published list.

limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://nexus.tony-xy-liu.com$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/awm/origin.pem;
    ssl_certificate_key /etc/awm/origin.key;
    return 444;
}

server {
    listen 443 ssl;
    server_name nexus.tony-xy-liu.com;

    ssl_certificate     /etc/awm/origin.pem;
    ssl_certificate_key /etc/awm/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The awm edge (httpsfront, public profile) decides what exists: it
    # answers 404 for every path off its allow-list, signed in or not.
    location = /__auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/awm-proxy.conf;
    }
    location / {
        include /etc/nginx/snippets/awm-proxy.conf;
    }
}
