<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>awm room (redirect)</title>
<script>
// Legacy entry point. The control center now lives at /ui/index.html with
// hash-routed tabs (#/status #/rooms #/room/<id>). Preserve everything in
// the URL hash (token, as, peer, and optionally room=<id>) and route to
// the new SPA, defaulting to the rooms tab when no room is named.
(function () {
  "use strict";
  const raw = location.hash.slice(1);
  const params = new URLSearchParams(raw);
  const room = params.get("room");
  // Strip ?room= from the config portion (it's not understood by the SPA).
  params.delete("room");
  const configPart = params.toString();
  const route = room ? `/room/${encodeURIComponent(room)}` : "/rooms";
  const target = "index.html#" + configPart + "#" + route;
  location.replace(target);
})();
</script>
</head>
<body>
<p>Redirecting to the awm control center… If this doesn't load,
<a href="index.html">click here</a>.</p>
</body>
</html>
