<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>awm rooms</title>
<style>
  :root {
    --bg: #0e0f12;
    --bg-2: #14161b;
    --bg-3: #1d2027;
    --fg: #d5d9e2;
    --fg-dim: #7e8597;
    --accent: #5fb1ff;
    --warn: #ffb454;
    --err: #ff7878;
    --sys: #888;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.45;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: var(--bg-2);
    border-bottom: 1px solid #2a2d36;
  }
  header h1 { font-size: 14px; margin: 0; color: var(--accent); }
  header input, header select {
    background: var(--bg-3); color: var(--fg); border: 1px solid #2a2d36;
    padding: 4px 8px; font: inherit; border-radius: 3px;
  }
  header button {
    background: var(--bg-3); color: var(--fg); border: 1px solid #2a2d36;
    padding: 4px 10px; font: inherit; cursor: pointer; border-radius: 3px;
  }
  header button:hover { background: #2a2d36; }
  #layout { display: grid; grid-template-columns: 240px 1fr 220px; height: calc(100vh - 40px); }
  #left, #right { background: var(--bg-2); overflow-y: auto; padding: 8px; }
  #left h2, #right h2 {
    font-size: 11px; text-transform: uppercase; color: var(--fg-dim);
    margin: 6px 4px; letter-spacing: 0.08em;
  }
  .room-card {
    padding: 6px 8px; margin-bottom: 4px; cursor: pointer;
    border-radius: 3px; background: var(--bg-3);
  }
  .room-card.active { background: #243047; color: #fff; }
  .room-card .topic { color: var(--fg-dim); font-size: 11px; }
  .room-card .id { font-weight: bold; }
  #transcript { padding: 12px; overflow-y: auto; }
  .post { margin-bottom: 8px; }
  .post .author { color: var(--accent); font-weight: bold; }
  .post.system .author { color: var(--sys); }
  .post.kind-tool_use .author { color: var(--warn); }
  .post.kind-tool_result .author { color: #8ad; }
  .post .ts { color: var(--fg-dim); font-size: 11px; margin-left: 4px; }
  .post .body { white-space: pre-wrap; word-break: break-word; }
  #composer { display: flex; gap: 4px; padding: 8px; background: var(--bg-2); border-top: 1px solid #2a2d36; }
  #composer input {
    flex: 1; background: var(--bg-3); color: var(--fg); border: 1px solid #2a2d36;
    padding: 6px 10px; font: inherit; border-radius: 3px;
  }
  #composer button { padding: 6px 14px; }
  .participant { padding: 4px 6px; font-size: 12px; }
  .participant .kind { color: var(--fg-dim); margin-right: 4px; font-size: 10px; }
  #middle { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #status { padding: 4px 10px; color: var(--fg-dim); font-size: 11px; background: var(--bg-2); border-top: 1px solid #2a2d36; }
  .err { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>awm rooms</h1>
  <input id="search" placeholder="search topic / transcript" />
  <select id="peer">
    <option value="">local</option>
    <option value="all">all peers</option>
  </select>
  <button id="searchBtn">search</button>
  <button id="newBtn">+ new</button>
  <span id="me" style="margin-left:auto;color:var(--fg-dim)"></span>
</header>
<div id="layout">
  <aside id="left">
    <h2>rooms</h2>
    <div id="roomList"></div>
  </aside>
  <main id="middle">
    <div id="transcript"></div>
    <div id="composer">
      <input id="input" placeholder="post to room (Enter)" disabled />
      <button id="sendBtn" disabled>send</button>
      <button id="closeBtn" disabled>close</button>
    </div>
    <div id="status">disconnected</div>
  </main>
  <aside id="right">
    <h2>participants</h2>
    <div id="participants"></div>
    <h2 style="margin-top:14px">actions</h2>
    <div style="display:flex;flex-direction:column;gap:4px">
      <input id="inviteScope" placeholder="invite scope: project/scope[@peer]" />
      <button id="inviteBtn" disabled>invite</button>
    </div>
  </aside>
</div>

<script>
"use strict";

// ---- config from URL hash --------------------------------------------------
const hash = new URLSearchParams(location.hash.slice(1));
const token = hash.get("token") || "";
const peer = hash.get("peer") || "";   // empty = local; otherwise display-only
const me = hash.get("as") || "user:operator";
document.getElementById("me").textContent = `as ${me}` + (peer ? ` @ ${peer}` : "");

if (!token) {
  document.body.innerHTML =
    `<div style="padding:24px;color:#ff7878">No token in URL hash.<br><br>` +
    `Open with: <code>#token=&lt;your-token&gt;</code></div>`;
  throw new Error("no token");
}

// All endpoints assume same-origin (this page is served by awm-exposed).
const base = location.origin;

async function api(method, path, body) {
  const init = {
    method,
    headers: {
      "Authorization": `Bearer ${token}`,
      "X-Awm-As": me,
    },
  };
  if (body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const r = await fetch(base + path, init);
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`${method} ${path} → ${r.status}: ${txt.slice(0, 200)}`);
  }
  return r.json();
}

// ---- state ------------------------------------------------------------------
let current = null;     // {id, ...}
let ws = null;
let backoff = 1000;

function setStatus(msg, isErr) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = isErr ? "err" : "";
}

// ---- room listing ----------------------------------------------------------
async function refreshRooms() {
  const peerParam = document.getElementById("peer").value;
  const params = new URLSearchParams({ status: "active" });
  if (peerParam) params.set("peer", peerParam);
  try {
    const r = await api("GET", `/rooms?${params}`);
    renderRooms(r.rooms);
  } catch (e) {
    setStatus(e.message, true);
  }
}
function renderRooms(rooms) {
  const list = document.getElementById("roomList");
  list.innerHTML = "";
  for (const r of rooms) {
    const div = document.createElement("div");
    div.className = "room-card" + (current && current.id === r.id ? " active" : "");
    div.innerHTML =
      `<div class="id">${escape(r.id)}</div>` +
      `<div class="topic">${escape(r.topic || "")} <span style="opacity:.6">@${escape(r.host_peer_id || "?")}</span></div>`;
    div.onclick = () => attachRoom(r);
    list.appendChild(div);
  }
}

// ---- attach -----------------------------------------------------------------
async function attachRoom(room) {
  current = room;
  document.querySelectorAll(".room-card").forEach(
    n => n.classList.toggle("active", n.querySelector(".id").textContent === room.id)
  );
  document.getElementById("transcript").innerHTML = "";
  document.getElementById("participants").innerHTML = "";

  closeWs();
  const detail = await api("GET", `/rooms/${room.id}`);
  for (const p of detail.participants) addParticipant(p);
  // History was sent by WS attach too; the REST recent gives a teaser.
  setStatus("connecting…");
  backoff = 1000;
  openWs(room.id);
  document.getElementById("input").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("closeBtn").disabled = false;
  document.getElementById("inviteBtn").disabled = false;
}

function openWs(roomId) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${proto}//${location.host}/rooms/${roomId}/attach`;
  ws = new WebSocket(url, [`bearer.${token}`]);
  ws.onopen = () => setStatus(`attached to ${roomId}`);
  ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
  ws.onclose = (e) => {
    setStatus(`disconnected (${e.code}); reconnecting…`, true);
    if (current && current.id === roomId) {
      setTimeout(() => openWs(roomId), backoff);
      backoff = Math.min(backoff * 2, 15000);
    }
  };
  ws.onerror = () => setStatus("ws error", true);
}
function closeWs() { if (ws) { try { ws.close(); } catch {} ws = null; } }

// ---- event rendering --------------------------------------------------------
function handleEvent(ev) {
  switch (ev.type) {
    case "history":
      for (const p of ev.posts) renderPost(p);
      break;
    case "post":
      renderPost(ev.post);
      break;
    case "participant_joined":
      addParticipant(ev.participant);
      break;
    case "participant_left":
      removeParticipant(ev.participant);
      break;
    case "room_closed":
      setStatus(`room closed @ ${ev.ts}`);
      break;
    case "upstream_disconnected":
      setStatus(`upstream ${ev.peer} disconnected: ${ev.reason}`, true);
      break;
    case "lagged":
      setStatus("lagged — reconnecting", true);
      break;
    case "error":
      setStatus(`server error: ${ev.message}`, true);
      break;
  }
}
function renderPost(p) {
  const div = document.createElement("div");
  div.className = `post kind-${p.kind || "text"}`;
  if (p.author === "system") div.classList.add("system");
  div.innerHTML =
    `<span class="author">${escape(p.author)}</span>` +
    `<span class="ts">${escape(p.ts || "")}</span>` +
    `<div class="body">${escape(p.body || "")}</div>`;
  const t = document.getElementById("transcript");
  t.appendChild(div);
  t.scrollTop = t.scrollHeight;
}
function addParticipant(p) {
  const el = document.getElementById("participants");
  const key = `${p.kind}:${p.identifier}`;
  if (el.querySelector(`[data-key="${cssEsc(key)}"]`)) return;
  const div = document.createElement("div");
  div.className = "participant";
  div.dataset.key = key;
  div.innerHTML = `<span class="kind">${escape(p.kind)}:</span>${escape(p.identifier)}`;
  el.appendChild(div);
}
function removeParticipant(p) {
  const key = `${p.kind}:${p.identifier}`;
  const n = document.getElementById("participants").querySelector(`[data-key="${cssEsc(key)}"]`);
  if (n) n.remove();
}

// ---- composer ---------------------------------------------------------------
function sendPost() {
  if (!ws || ws.readyState !== 1) return;
  const inp = document.getElementById("input");
  const body = inp.value.trim();
  if (!body) return;
  ws.send(JSON.stringify({ type: "post", body }));
  inp.value = "";
}
document.getElementById("sendBtn").onclick = sendPost;
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault(); sendPost();
  }
});

document.getElementById("closeBtn").onclick = async () => {
  if (!current) return;
  if (!confirm(`Close room ${current.id}?`)) return;
  try {
    await api("POST", `/rooms/${current.id}/close`, { kill_agents: false });
  } catch (e) { setStatus(e.message, true); }
};

document.getElementById("inviteBtn").onclick = async () => {
  const scope = document.getElementById("inviteScope").value.trim();
  if (!current || !scope) return;
  try {
    await api("POST", `/rooms/${current.id}/invite`, { scope });
    document.getElementById("inviteScope").value = "";
  } catch (e) { setStatus(e.message, true); }
};

document.getElementById("newBtn").onclick = async () => {
  const topic = prompt("Topic (optional):", "");
  if (topic === null) return;
  try {
    const room = await api("POST", "/rooms", { topic: topic || null, scopes: [], prompts: {} });
    await refreshRooms();
    attachRoom(room);
  } catch (e) { setStatus(e.message, true); }
};

// ---- search -----------------------------------------------------------------
document.getElementById("searchBtn").onclick = async () => {
  const q = document.getElementById("search").value.trim();
  if (!q) return refreshRooms();
  const params = new URLSearchParams({ q });
  const peerParam = document.getElementById("peer").value;
  if (peerParam) params.set("peer", peerParam);
  try {
    const r = await api("GET", `/rooms/search?${params}`);
    renderRooms(r.rooms);
    if (r.degraded && r.degraded.length) {
      setStatus(`search complete; degraded peers: ${r.degraded.map(d => d.peer_id).join(", ")}`, true);
    }
  } catch (e) { setStatus(e.message, true); }
};
document.getElementById("search").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("searchBtn").click();
});
document.getElementById("peer").addEventListener("change", refreshRooms);

// ---- utils ------------------------------------------------------------------
function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function cssEsc(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g, "_"); }

// ---- boot -------------------------------------------------------------------
refreshRooms();
setInterval(refreshRooms, 15000);
</script>
</body>
</html>
