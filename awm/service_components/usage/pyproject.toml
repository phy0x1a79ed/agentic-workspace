[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-usage"
version = "0.1.0"
requires-python = ">=3.11"
description = "Report plugin use the gateway cannot see: background runs and use straight from code (R132). Standard library only, so any project can import it."
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/usage/.
[tool.setuptools.packages.find]
include = ["awm.usage*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
