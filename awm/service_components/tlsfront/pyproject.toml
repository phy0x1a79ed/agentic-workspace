[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-tlsfront"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM tlsfront: the TLS reverse proxy every off-host awm listener is built on — the shared root CA and leaf certs, awm's edge session check, and an HTTP and WebSocket relay to one loopback upstream. Pure imported source; no console scripts, no install.sh."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "awm-grantlib",
    "starlette",
    "uvicorn",
    "httpx",
    "websockets",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/tlsfront/.
[tool.setuptools.packages.find]
include = ["awm.tlsfront*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real docker, or network; excluded from smoke",
    "unit: pure unit tests (models, validation, registries)",
    "integration: cross-component integration tests",
]
