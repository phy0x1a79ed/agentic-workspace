[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-config"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM system-wide configuration constants (paths, gateway host/port, idle policy, .awm/env loader)."
dependencies = [
    "pyyaml",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/config/.
[tool.setuptools.packages.find]
include = ["awm.config*"]
namespaces = true
