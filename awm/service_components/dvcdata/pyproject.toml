[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-dvcdata"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM dvcdata: the DVC data layer a scope's code and data share — repo wiring, hooks, chunk mounts, shared-chunk links and the keep-set gc. Used by the scopes and dvc services. Pure imported source; no console scripts, no install.sh."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/dvcdata/.
[tool.setuptools.packages.find]
include = ["awm.dvcdata*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
