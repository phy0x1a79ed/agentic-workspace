[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-tether"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM tether host: fetch the pinned tether binaries and keep this host's one running, the relay on the public host or the operator daemon on a member node."
dependencies = [
    "awm-gatewayclient",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
    "integration: runs a tether binary; slower",
]

# PEP 420 namespace package: no top-level awm/__init__.py.
[tool.setuptools.packages.find]
include = ["awm.tether*"]
namespaces = true
