[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-vpn"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM vpn service: VPN egress exits (UBC openconnect, Proton) as singleton containers other processes route through."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/vpn/.
[tool.setuptools.packages.find]
include = ["awm.vpn*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real docker, or network; excluded from smoke",
    "unit: pure unit tests (models, validation, registries)",
    "integration: cross-component integration tests",
]
