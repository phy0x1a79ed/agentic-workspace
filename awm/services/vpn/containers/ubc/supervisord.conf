# Supervisor config for the UBC VPN exit.
#
# The fail-closed kill-switch is the `quit_on_failure` eventlistener (the
# vpn_bounce pattern): openconnect runs as the sole program with autorestart
# disabled, so the instant it exits (tunnel drop, auth failure, idle timeout)
# supervisor receives PROCESS_STATE_EXITED, the listener SIGTERMs supervisord
# (its PPID), and the container exits — tearing down the shared netns so every
# consumer attached via `--network=container:awm-vpn-ubc` loses egress. No
# plaintext fallback.
[supervisord]
user=root
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:openconnect]
command=/usr/local/bin/dial.sh
startretries=0
startsecs=9999999          ; effectively never "started ok" → exit always counts as failure
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:quit_on_failure]
command=sh -c "printf 'READY\n' && while read line; do kill -SIGTERM $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
