# Supervisor config for the Proton VPN exit — same fail-closed kill-switch as
# the UBC exit. dial.sh logs in, connects, then BLOCKS in a foreground keepalive
# that polls the tunnel; the moment Proton reports disconnected, dial.sh exits,
# the listener SIGTERMs supervisord, and the container goes down — dropping every
# consumer's egress (no plaintext fallback).
[supervisord]
user=root
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:proton]
command=/usr/local/bin/dial.sh
startretries=0
startsecs=9999999
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:quit_on_failure]
command=sh -c "printf 'READY\n' && while read line; do kill -SIGTERM $PPID; done"
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
