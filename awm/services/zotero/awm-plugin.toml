[plugin]
name = "zotero"
version = "0.1.0"

[[service]]
name = "zotero"

[[tool]]
name = "zotero"
major = 1
tier = "off"

[needs]
secrets = ["ZOTERO_API_KEY"]
network = []
platform = ["linux"]

[[needs.tool]]
name = "trilium"
major = 1
verbs = ["note_search", "note_get", "note_upsert", "note_create", "note_update", "attr_set", "note_place", "attachment_put", "note_delete"]

[[needs.tool]]
name = "auth"
major = 1
verbs = ["sign_peer_token"]
