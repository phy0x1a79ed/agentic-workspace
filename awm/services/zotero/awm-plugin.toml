[plugin]
name = "zotero"
# Restarts this plugin alone after a deploy (routines.md R33).
refresh = "awm services restart zotero"
version = "0.1.0"

[[service]]
name = "zotero"

[[tool]]
name = "zotero"
major = 1
tier = "off"

[needs]
secrets = ["ZOTERO_API_KEY"]
network = ["api.zotero.org", "stream.zotero.org"]
platform = ["linux"]

[[needs.tool]]
name = "trilium"
major = 1
verbs = ["note_search", "note_get", "note_upsert", "note_create", "note_update", "attr_set", "note_place", "note_delete", "attachment_get", "attachment_put"]

[[needs.tool]]   # Sync now orders from alcor, through this node's relay (fleet.md R83)
name = "operations"
major = 2
verbs = ["order_pull", "order_done"]
