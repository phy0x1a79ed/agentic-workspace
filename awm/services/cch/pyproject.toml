[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-cch"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM cch: the Claude Code harness plugin."
dependencies = [
    "awm-claudedaemon",
    "awm-config",
    "awm-gatewayclient",
    "awm-kept",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/cch/.
[tool.setuptools.packages.find]
include = ["awm.cch*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "unit: pure unit tests (models, validation, registries)",
    "reflection: reflection service self-injection",
]
