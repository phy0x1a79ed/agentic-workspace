[plugin]
name = "cch"
version = "0.1.0"

[[service]]
name = "cch"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "harness-cc"
major = 1
service = "cch"
tier = "off"
implements = ["harness@1"]

[needs]
secrets = []
network = ["api.anthropic.com", "*.anthropic.com", "claude.ai", "*.claude.ai", "storage.googleapis.com"]
platform = ["linux"]

[[needs.tool]]
name = "reflection"   # reflection: cch sends it harness_event
major = 1
verbs = ["harness_event", "message"]

[[needs.tool]]
name = "social"
major = 1
verbs = ["send"]

[[needs.tool]]
name = "operations"
major = 1
verbs = ["task_attach"]

[[needs.tool]]
name = "scope"
major = 1
verbs = ["tag", "create"]

