[plugin]
name = "cch"
version = "0.1.0"
trust = "own"

[[service]]
name = "cch"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "harness-cc"
major = 1
service = "cch"
tier = "off"
implements = ["harness@1"]

[needs]
secrets = []
network = []
platform = ["linux"]

[[needs.tool]]
name = "reflection"   # reflection: cch sends it harness_event
major = 1
