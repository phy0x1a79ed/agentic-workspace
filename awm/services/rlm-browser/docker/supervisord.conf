# Common supervisord base for the rlm-browser image. The mode-specific
# [program:*] blocks are appended by entrypoint.sh (it can't be done with env
# conditionals in a static conf), so this file holds only what BOTH modes share:
# the supervisord daemon config and the kill-switch.
#
# quit_on_failure mirrors projects/vpn_bounce: when a supervised program goes
# FATAL (exhausted its restarts and given up), it SIGTERMs supervisord (PID 1)
# and the container exits. We watch FATAL only — NOT EXITED — so a transient
# restart blip, or our own intentional Browser.close at release, doesn't bring
# the container down mid-flight (the host tears containers down with
# `docker rm -f`). A permanently-dead Chrome still exhausts its retries → FATAL →
# container exits. T4 (VPN) extends this: the openconnect sidecar registers with
# autorestart=false so a dropped tunnel goes straight to FATAL — the kill-switch
# that stops Chrome ever outliving its tunnel and leaking on the host's egress.
[supervisord]
nodaemon=true
user=chrome
logfile=/var/log/rlm/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/rlm

[eventlistener:quit_on_failure]
command=sh -c "printf 'READY\n' && while read line; do kill -SIGTERM $PPID; done"
events=PROCESS_STATE_FATAL
