[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-rlm-browser"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM rlm-browser realm service: Chrome/CDP browser session pool (realm-family contract)."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/rlm_browser/.
[tool.setuptools.packages.find]
include = ["awm.rlm_browser*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real git, or network simulation; excluded from smoke",
    "unit: pure unit tests (models, validation, registries)",
    "integration: cross-component integration tests",
]
