[plugin]
name = "rlm-factorio"
# Restarts this plugin alone after a deploy (routines.md R33).
refresh = "awm services restart rlm-factorio"
version = "0.1.0"

[[service]]
name = "rlm-factorio"
profiles = ["gamebot"]

[[tool]]
name = "factorio"
major = 1
tier = "off"

[needs]
secrets = ["RLM_FACTORIO_ADMIN_TOKEN_FILE"]
network = []
platform = ["linux"]
