# Gateway discovery profile marker (see awm/gateway/.../hub/discovery.py):
# this service bootstraps only on a gateway whose AWM_PROFILES includes one of
# these (an explicit `awm services enable` still overrides). Keeps the Factorio
# appliance from docker-booting on dev/prod when the folder merges.
profiles = ["gamebot"]

# The Factorio appliance is a gamebot tool, not an agent-facing one.
tool = "factorio"
tier = "off"
