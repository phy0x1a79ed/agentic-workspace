; Factorio config for a seat client rendering into a private Xvfb display with
; Mesa's software rasterizer. Every override here exists to cut render cost:
; the engine has NO frame-rate limit setting (the full [graphics] default set
; carries none), and Xvfb reports a 0 Hz refresh so vsync cannot pace it
; either. Pixels and per-frame work are therefore the only levers.
[path]
read-data=__PATH__executable__/../../data
write-data=__PATH__executable__/../..

[general]
locale=auto

[graphics]
; The animated main-menu scene renders continuously while a seat sits at the
; menu waiting to connect. It is pure waste here.
show-game-simulations-in-background=false
; Rendering stops entirely while the window is unmapped; take_screenshot still
; renders offscreen at its own resolution, so vision is unaffected.
halt-rendering-when-minimized=true
graphics-quality=medium
video-memory-usage=low
max-threads=2
full-screen=false
show-smoke=false
show-clouds=false
show-decoratives=false
show-particles=false
show-item-shadows=false
show-inserter-shadows=false
show-animated-water=false
show-tree-distortion=false
additional-terrain-effects=false
high-quality-animations=false
high-quality-shadows=false
high-quality-terrain=false
light-occlusion=false

[sound]
master-volume=0
