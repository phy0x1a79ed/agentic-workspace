[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-notifications"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM notifications service: agent-attention board — harness hooks report turn ends / questions / errors; the board + desktop notifications surface them."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/notifications/.
[tool.setuptools.packages.find]
include = ["awm.notifications*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "unit: pure unit tests (classifier, dedupe, lifecycle)",
    "notifications: agent-attention notification service",
    "integration: cross-component integration tests",
]
