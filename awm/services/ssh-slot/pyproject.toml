[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-ssh-slot"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM ssh-slot singleton: the fleet's single-attempt arbiter for lockout-sensitive ssh hosts."
dependencies = [
    "awm-ssh",
]

[tool.setuptools.packages.find]
include = ["awm.ssh_slot*"]
namespaces = true
