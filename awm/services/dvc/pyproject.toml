[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-dvc"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM dvc service: the chinook Globus collection as an append-only remote for the shared DVC cache — a daily whole-cache sync, plus a hash-selective per-scope pull/push inverse."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "pyyaml",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# The scheduled nightly sync. Not a CLI verb: the generated service CLI caps
# /invoke at 600s, which cannot cover a multi-hour transfer, and a submit-only
# oneshot unit would report success on a failed backup. See awm/dvc/nightly.py.
[project.scripts]
awm-dvc-sync = "awm.dvc.nightly:main"

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/dvc/.
[tool.setuptools.packages.find]
include = ["awm.dvc*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
