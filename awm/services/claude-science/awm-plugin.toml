[plugin]
name = "claude-science"
# Restarts this plugin alone after a deploy (routines.md R33).
refresh = "awm services restart claude-science"
version = "0.1.0"

[[service]]
name = "claude-science"
install = "install.sh"
profiles = ["claude-science"]

# Two origins on purpose: a page Claude wrote must not be same-origin with the session that wrote
# it. Tailscale serve publishes these as :12201 and :12202 on the nodes that run the workbench.
[[service.front]]
name = "gui"
port = 12211
upstream = "http://127.0.0.1:12203"
paths = { "/_signin" = "http://127.0.0.1:12210" }

[[service.front]]
name = "sandbox"
port = 12212
upstream = "http://127.0.0.1:12204"

[[tool]]
name = "science"
major = 1
tier = "on"

[[page]]
name = "claude-science"
dir = "pages/claude-science/dist"

[needs]
secrets = []
network = ["api.anthropic.com", "*.anthropic.com", "claude.ai", "*.claude.ai", "storage.googleapis.com"]
platform = ["linux"]

[[needs.tool]]
name = "scope"
major = 1

[[needs.tool]]
name = "journal"
major = 1

[[needs.tool]]
name = "search"
major = 1

[[needs.tool]]
name = "dvc"
major = 1
