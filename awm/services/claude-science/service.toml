# This service bootstraps only on a gateway whose AWM_PROFILES includes one of
# these (an explicit `awm services enable` still overrides).
#
# Gated because it wraps a 160 MB binary and a ~6 GB data directory that exist
# on exactly one node. On a node without them the service would still register
# and report "binary absent" forever — correct, but noise in `awm services
# list` on every other machine in the fleet. Federation makes the verbs
# reachable from anywhere regardless: with one provider, the domain resolves to
# that node with no `peer=` argument.
profiles = ["claude-science"]
