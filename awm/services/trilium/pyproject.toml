[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-trilium"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM trilium service: supervise the shared Trilium knowledge base on loopback, and snapshot, restore and export it. The awm edge serves it at /vault; this service never binds a public port."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    # Deliberately NOT awm-httpsfront. The edge routes the vault; this service
    # only supervises it. The dependency pointed the other way when each person
    # had their own TLS front, and leaving it would make it easy to grow a
    # second listener here again — which is the one thing the design forbids.
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/trilium/.
[tool.setuptools.packages.find]
include = ["awm.trilium*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
]
