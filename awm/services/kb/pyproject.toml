[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-kb"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM kb service: supervise the kb server (Cognee, in its own env), feed it this node's scope posts, and relay its recall."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/kb/.
[tool.setuptools.packages.find]
include = ["awm.kb*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
