# The Python papers plugin: the paper corpus and the Zotero library, until their move into kb's
# LanceDB. Its tool stays `kb`, so search asks it as today. The Rust plugin `kb` serves journal,
# search and transcripts.
[plugin]
name = "papers"
version = "0.1.0"

[[service]]
name = "papers"
install = "install.sh"

[[service.archive]]
name = "kb"
mode = "live"
query = "kb_query"
get = "kb_get"
hit = ["title", "ts"]

[service.archive.fields]
title = "content"
text = "content"
ts = "datetime"
author = "categorical"
tag = "categorical"
cites = "categorical"
cited_by = "categorical"

[[service.archive]]
name = "library"
mode = "live"
query = "kb_library"
get = "kb_get"

# The gateway resolves search's needs against this tool. Every verb is off MCP (surfaces cli, http):
# search reads kb as two sources.
[[tool]]
name = "kb"
major = 1
tier = "off"

[needs]
secrets = []
network = ["huggingface.co", "*.huggingface.co", "*.hf.co"]
platform = ["linux"]

[[needs.tool]]
name = "zotero"
major = 1

