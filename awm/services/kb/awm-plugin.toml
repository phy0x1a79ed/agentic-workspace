[plugin]
name = "kb"
version = "0.1.0"

[[service]]
name = "kb"

[[service.archive]]
name = "kb"
mode = "live"
query = "kb_query"
get = "kb_get"
hop = "kb_hop"
links = ["citations", "cited_by", "authors"]

[[service.archive]]
name = "library"
mode = "live"
query = "kb_library"
get = "kb_get"
hop = "kb_hop"
links = ["citations", "cited_by", "authors"]

# The gateway resolves search's needs against this tool. Every verb is off MCP (surfaces cli, http):
# search reads kb as two sources and walks them with its `hop`.
[[tool]]
name = "kb"
major = 1
tier = "off"

[needs]
secrets = []
network = ["huggingface.co", "*.huggingface.co", "*.hf.co"]
platform = ["linux"]

[[needs.tool]]
name = "zotero"
major = 1
verbs = ["items"]

