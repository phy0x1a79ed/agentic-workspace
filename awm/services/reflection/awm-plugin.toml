[plugin]
name = "reflection"
version = "0.2.0"

[[service]]
name = "reflection"
path = "."
run = "run.sh"

[[tool]]
name = "reflection"
major = 1
service = "reflection"
implements = ["reflection@1"]
tier = "on"

[needs]
secrets = []
network = []

# Every harness plugin: cch (harness-cc), dsh (harness-ds). See harness-contract.md.
[[needs.contract]]
name = "harness"
major = 1

[[needs.tool]]
name = "operations"
major = 2

[[needs.tool]]
name = "scope"
major = 1

[[needs.tool]]
name = "journal"
major = 1

