[plugin]
name = "journal"
version = "0.1.0"

[[service]]
name = "journal"

[[service.archive]]
name = "journals"
mode = "index"
export = "journal_export"
topic = "posts"
hit = ["title", "ts"]

[service.archive.fields]
title = "content"
text = "content"
ts = "datetime"
project = "categorical"
scope = { class = "categorical", nested = "/" }
tag = "categorical"
replies_to = "categorical"

[[tool]]
name = "journal"
major = 1
tier = "on"

[needs]
secrets = []
network = []
platform = ["linux"]

[[needs.tool]]
name = "scope"
major = 1
verbs = ["resolve"]

[[needs.tool]]
name = "search"
major = 1
verbs = ["query"]

[[needs.tool]]
name = "reflection"
major = 1
verbs = ["start_other", "session_of"]

