[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-claude-view"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM claude-view service: supervises the upstream claude-view server (a foreign Rust binary indexing ~/.claude/projects) as a child process, and fronts it on the mesh over TLS behind awm's edge auth."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    # Service-on-service: the mesh front reuses awm.httpsfront's cert minting,
    # AuthGate, and reverse proxy rather than reimplementing TLS + WebSocket
    # bridging. Declared rather than assumed — both land in the same env, so an
    # undeclared import would work right up until httpsfront was uninstalled.
    "awm-httpsfront",
    "httpx",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/claude_view/.
[tool.setuptools.packages.find]
include = ["awm.claude_view*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
    "smoke: fast unit tests; target <30s",
]
