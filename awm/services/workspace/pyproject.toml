[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-workspace"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM workspace service: DAG execution units (workdir + pre-readings + deliverable staging)."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/workspace/.
[tool.setuptools.packages.find]
include = ["awm.workspace*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real git, or network simulation; excluded from smoke",
    "unit: pure unit tests (models, validation, registries)",
    "workspace: workspace unit lifecycle (create / retain / destroy / resolve)",
    "integration: cross-component integration tests",
]
