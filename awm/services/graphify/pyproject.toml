[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-graphify"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM graphify service: a queryable knowledge graph of the awm source tree (AST-only, local) via the graphify CLI — build/query/path/status over the gateway catalog."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/graphify/.
[tool.setuptools.packages.find]
include = ["awm.graphify*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
