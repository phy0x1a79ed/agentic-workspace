[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-scopeview"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM scopeview service: a scope's XGDB raw tables and the chain of work built on them, at any git ref."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "pyarrow",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["awm.scopeview*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
]
