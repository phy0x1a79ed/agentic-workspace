[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-tts"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM tts service: TTS-only — engine registry (kokoro_rvc/piper/sbv2 + loadable f5tts/gptsovits), presets/state, and a direct PCM playback session."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
    "httpx",
    "numpy",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/tts/.
[tool.setuptools.packages.find]
include = ["awm.tts*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
