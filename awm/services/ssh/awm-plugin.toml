[plugin]
name = "ssh"
version = "0.1.0"

[[service]]
name = "ssh"
install = "install.sh"

[[tool]]
name = "ssh"
major = 1
tier = "on"

[needs]
secrets = []
network = ["tcp:22 the hosts of ~/.ssh/config"]
platform = ["linux"]

[[needs.tool]]
name = "2fa"
major = 1

[[needs.tool]]
name = "social"
major = 1

[[needs.tool]]
name = "vpn"
major = 1

