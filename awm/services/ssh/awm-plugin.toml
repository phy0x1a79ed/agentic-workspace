[plugin]
name = "ssh"
version = "0.1.0"

[[service]]
name = "ssh"

[[tool]]
name = "ssh"
major = 1
tier = "on"

[needs]
secrets = []
network = ["tcp:22 the hosts of ~/.ssh/config"]
platform = ["linux"]

[[needs.tool]]
name = "2fa"
major = 1
verbs = ["burst", "status", "ping"]

[[needs.tool]]
name = "social"
major = 1
verbs = ["send", "emit_probe"]

[[needs.tool]]
name = "vpn"
major = 1
verbs = ["up"]

[[needs.tool]]
name = "auth"
major = 1
verbs = ["sign_peer_token"]
