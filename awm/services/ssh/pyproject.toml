[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-ssh"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM ssh service: headless ControlMaster SSH connection management for managed hosts."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
]

[tool.setuptools.packages.find]
include = ["awm.ssh*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit tests; target <30s",
    "slow: subprocess or network tests",
]
