[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-discord"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM discord service: discord operator bridge and config."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
    "discord.py>=2.3",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/discord/.
[tool.setuptools.packages.find]
include = ["awm.discord*"]
namespaces = true
