[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-auth"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM auth service: the credential authority. Mints paired (login-password, peer-credential) generations on a 12h cadence with 24h overlapping validity, signs sliding session tokens, pushes the day's login password to Discord, and mirrors the current peer credential to $AWM_PEER_CRED for the SSH peer-auth channel. The httpsfront edge enforces auth using material this service hands it."
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
    "pydantic>=2",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/auth/.
[tool.setuptools.packages.find]
include = ["awm.auth*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real docker, or network; excluded from smoke",
    "unit: pure unit tests (models, validation, registries)",
    "integration: cross-component integration tests",
]
