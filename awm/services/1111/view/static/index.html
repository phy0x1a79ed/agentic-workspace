<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="{{BASE}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Viewer</title>
<link rel="stylesheet" href="static/style.css?v={{V}}">
</head>
<body>
<aside id="sidebar">
  <section>
    <h2>Outputs</h2>
    <ul id="dirs" class="tree"></ul>
  </section>
  <section>
    <h2>Folders <button id="new-folder" title="New folder">+</button></h2>
    <ul id="folders" class="tree"></ul>
  </section>
  <section>
    <ul class="tree"><li><div class="node" id="trash-node" data-source="trash">Trash <span class="count" id="trash-count"></span></div></li></ul>
  </section>
  <div id="scan-status"></div>
</aside>
<main>
  <header id="toolbar">
    <span id="title"></span>
    <span id="selection-info"></span>
    <span class="spacer"></span>
    <button id="btn-add" data-needs-selection>Add to folder…</button>
    <button id="btn-remove" data-needs-selection hidden>Remove from folder</button>
    <button id="btn-trash" data-needs-selection>Delete</button>
    <button id="btn-restore" data-needs-selection hidden>Restore</button>
    <button id="btn-purge-sel" data-needs-selection hidden>Delete permanently</button>
    <button id="btn-empty" hidden>Empty trash</button>
    <label title="Thumbnail size"><input type="range" id="zoom" min="100" max="320" step="10" value="180"></label>
  </header>
  <div id="grid"></div>
  <div id="sentinel"></div>
</main>

<div id="viewer" hidden>
  <div id="stage">
    <img id="full" alt="" draggable="false">
    <div id="zoom-bar">
      <button id="zoom-in" title="Zoom in (+)">+</button>
      <input type="range" id="zoom-range" min="0" max="100" value="0" aria-label="Zoom">
      <button id="zoom-out" title="Zoom out (-)">−</button>
      <button id="zoom-level" title="Toggle fit / actual pixels (0)"></button>
    </div>
    <button class="nav" id="prev" title="Previous (←)">‹</button>
    <button class="nav" id="next" title="Next (→)">›</button>
    <button id="close" title="Close (Esc)">×</button>
    <button id="toggle-info" title="Info (i)">i</button>
    <div id="counter"></div>
  </div>
  <aside id="info"></aside>
</div>

<dialog id="picker">
  <form method="dialog">
    <h3>Add to folder</h3>
    <ul id="picker-list" class="tree"></ul>
    <div class="row">
      <input id="picker-new" placeholder="New folder name">
      <button value="cancel">Cancel</button>
    </div>
  </form>
</dialog>

<div id="toast" hidden></div>
<script src="static/app.js?v={{V}}"></script>
</body>
</html>
