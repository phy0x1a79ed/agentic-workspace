[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-twofa"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM 2fa service: local Duo Mobile device (push approve/deny + burst-hold engine)."
# Ported from the AGPL-3.0 virtual-auth project (itself derived from the
# reverse-engineered falsidge/ruo). See LICENSE in this folder.
dependencies = [
    "awm-config",
    "awm-persistence",
    "awm-gatewayclient",
    "pycryptodome>=3.17",
    "requests>=2.28",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is
# awm/twofa/. The service/folder name is `2fa`; only the import package differs
# (a module name cannot start with a digit).
[tool.setuptools.packages.find]
include = ["awm.twofa*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "unit: pure unit tests (engine policy, models, validation)",
    "slow: spawns subprocesses or real network; excluded from smoke",
]
