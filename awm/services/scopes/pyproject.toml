[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-scopes"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM scopes service: scope lifecycle (worktree/.awm/heal/sync/repair/context-emit), git, comms (scope-as-channel), and sessions."
dependencies = [
    "awm-config",
    "awm-persistence",
    "fastapi",
    "httpx",
    "pyyaml",
    "websockets",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/scopes/.
[tool.setuptools.packages.find]
include = ["awm.scopes*"]
namespaces = true

[tool.setuptools.package-data]
"awm.scopes" = ["_room_names_data/*.txt"]
