[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-hermes"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM hermes service: supervise the Hermes Agent dashboard (adopt-don't-own) and mount its GUI on the gateway at /ui/hermes behind awm's edge session."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    "httpx",
    "websockets",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/hermes/.
[tool.setuptools.packages.find]
include = ["awm.hermes*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
]
