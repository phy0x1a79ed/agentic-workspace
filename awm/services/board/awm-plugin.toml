# board: the federation board's door and its intake, until channels.md R77 retires them.
# It publishes no tool. Only the host (AWM_BOARD_ROLE=host, deneb) runs anything.
[plugin]
name = "board"
version = "0.2.0"

[[service]]
name = "board"
path = "."
run = "run.sh"
install = "install.sh"

[needs]
secrets = ["AWM_BOARD_TOKEN"]
network = []
platform = ["linux"]

[[needs.tool]]   # the cards and their chat notes in the vault
name = "trilium"
major = 1
verbs = ["note_get", "note_search", "note_create", "note_update", "note_place", "attr_set", "attr_delete"]

[[needs.tool]]   # intake: posts to this swarm become Proposed cards
name = "operations"
major = 2
verbs = ["intake_post", "intake_message"]
