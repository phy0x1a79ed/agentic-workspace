# board: the federation board's door and its intake, until channels.md R77 retires them.
# It publishes no tool. Only the host (AWM_BOARD_ROLE=host, deneb) runs anything.
[plugin]
name = "board"
version = "0.2.0"

[[service]]
name = "board"
path = "."
run = "run.sh"
install = "install.sh"

[needs]
secrets = ["AWM_BOARD_TOKEN"]
network = []
platform = ["linux"]

[[needs.tool]]   # the cards and their chat notes in the vault
name = "trilium"
major = 1
