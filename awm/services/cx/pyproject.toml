[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-cx"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM cx service: keeps one Claude Code session warm so `cx` starts instantly."
dependencies = [
    "awm-gatewayclient",
    "awm-claudedaemon",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/cx/.
[tool.setuptools.packages.find]
include = ["awm.cx*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
