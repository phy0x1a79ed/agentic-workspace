<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b12" />
<title>WSL · Remote Mic</title>
<style>
  :root {
    color-scheme: dark;
    --bg:#070b12; --panel:#0c131e; --panel2:#0a0f18;
    --line:rgba(122,164,206,.14); --line2:rgba(122,164,206,.30);
    --text:#dbe6f2; --muted:#6d8198;
    --cyan:#2fd9f5; --air:#ff3b4e; --amber:#ffb020; --good:#46e6a3;
    --mono:ui-monospace,"SF Mono",Menlo,monospace; --sans:system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; min-height:100svh; display:flex; flex-direction:column;
    font-family:var(--sans); color:var(--text); background:var(--bg);
    -webkit-tap-highlight-color:transparent;
  }
  .bar {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:max(10px,env(safe-area-inset-top)) 16px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),var(--panel2));
  }
  .brand { font-family:var(--mono); font-size:.68rem; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
  .brand b { color:var(--cyan); font-weight:700; }
  .conn { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
  .conn.offline .dot { background:var(--air); box-shadow:0 0 9px var(--air); }
  .conn.offline .txt { color:var(--air); }
  .conn.connecting .dot { background:var(--amber); animation:pulse 1s ease-in-out infinite; }
  .conn.connecting .txt { color:var(--amber); }
  .conn.connected .dot { background:var(--good); box-shadow:0 0 9px var(--good); }
  .conn.connected .txt { color:var(--good); }
  .conn.streaming .dot { background:var(--cyan); box-shadow:0 0 9px var(--cyan); animation:pulse 1.2s ease-in-out infinite; }
  .conn.streaming .txt { color:var(--cyan); }

  main {
    flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px 18px max(24px,env(safe-area-inset-bottom));
  }
  .meter { position:relative; width:120px; height:120px; flex:0 0 auto; }
  .ring { position:absolute; inset:0; transform:rotate(-90deg); overflow:visible; }
  .ring-track { fill:none; stroke:rgba(122,164,206,.14); stroke-width:6; }
  .ring-level { fill:none; stroke:var(--air); stroke-width:8; stroke-linecap:round;
    transition:stroke .25s ease, filter .25s ease; }
  #stage[data-state="connected"] .ring-level { stroke:var(--good); filter:drop-shadow(0 0 7px rgba(70,230,163,.6)); }
  #stage[data-state="streaming"] .ring-level { stroke:var(--cyan); filter:drop-shadow(0 0 9px rgba(47,217,245,.7)); }

  .toggle {
    width:200px; min-height:64px; border-radius:16px; cursor:pointer;
    border:1px solid var(--line2); color:var(--text);
    background:radial-gradient(120% 140% at 50% 20%,rgba(47,217,245,.10),transparent 60%),linear-gradient(180deg,#101a27,#0a121c);
    box-shadow:0 10px 30px -16px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.05) inset;
    display:grid; place-content:center; gap:3px; text-align:center;
    font-family:var(--mono); user-select:none; -webkit-user-select:none;
    transition:transform .08s ease, box-shadow .2s, border-color .2s, background .2s;
  }
  .toggle:active { transform:scale(.985); }
  .toggle .lab { font-weight:700; font-size:1.25rem; letter-spacing:.14em; }
  .toggle .sub { font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  #stage[data-state="connected"] .toggle {
    border-color:rgba(70,230,163,.6); color:#fff;
    background:radial-gradient(120% 140% at 50% 20%,rgba(70,230,163,.22),transparent 62%),linear-gradient(180deg,#0c1a15,#0a140f);
    box-shadow:0 0 0 1px rgba(70,230,163,.35), 0 0 30px -8px rgba(70,230,163,.45), 0 10px 30px -16px rgba(0,0,0,.9);
  }
  #stage[data-state="streaming"] .toggle {
    border-color:rgba(47,217,245,.6); color:#fff;
    background:radial-gradient(120% 140% at 50% 20%,rgba(47,217,245,.26),transparent 62%),linear-gradient(180deg,#0a1722,#08111a);
    box-shadow:0 0 0 1px rgba(47,217,245,.4), 0 0 34px -6px rgba(47,217,245,.5), 0 10px 30px -16px rgba(0,0,0,.9);
    animation:streampulse 1.4s ease-in-out infinite;
  }
  #stage[data-state="offline"] .toggle {
    border-color:rgba(255,59,78,.55); color:#fff;
    background:radial-gradient(120% 140% at 50% 20%,rgba(255,59,78,.20),transparent 62%),linear-gradient(180deg,#1a1013,#130b0e);
    box-shadow:0 0 0 1px rgba(255,59,78,.35), 0 10px 30px -16px rgba(0,0,0,.9);
  }
  #stage[data-state="connected"] .toggle .sub,
  #stage[data-state="streaming"] .toggle .sub,
  #stage[data-state="offline"] .toggle .sub { color:rgba(255,255,255,.72); }

  #msg { font-family:var(--mono); font-size:.66rem; letter-spacing:.06em; color:var(--cyan); min-height:1em; text-align:center; }
  #msg.err { color:var(--air); }
  .foot { font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; color:var(--muted); text-align:center; }
  .foot a { color:var(--muted); }
  .warnbar { flex:0 0 auto; margin:0; padding:10px 14px; font-size:.72rem; text-align:center;
    background:rgba(255,176,32,.10); border-top:1px solid rgba(255,176,32,.35); color:var(--amber); }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  @keyframes streampulse {
    0%,100% { box-shadow:0 0 0 1px rgba(47,217,245,.4), 0 0 30px -8px rgba(47,217,245,.45), 0 10px 30px -16px rgba(0,0,0,.9); }
    50%     { box-shadow:0 0 0 1px rgba(47,217,245,.6), 0 0 48px -2px rgba(47,217,245,.65), 0 10px 30px -16px rgba(0,0,0,.9); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">WSL · <b>REMOTE MIC</b></div>
    <div id="conn" class="conn connected"><span class="dot"></span><span class="txt">connected</span></div>
  </div>

  <p id="warn" class="warnbar" hidden></p>

  <main id="stage" data-state="connected">
    <div class="meter">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle id="lvl" class="ring-level" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
      </svg>
    </div>
    <button id="toggle" class="toggle" aria-pressed="false">
      <span class="lab" id="tLab">START</span>
      <span class="sub" id="tSub">tap to stream mic</span>
    </button>
    <p id="msg">idle</p>
    <p class="foot">phone mic → WSL · <a href="/ca.crt">install certificate</a></p>
  </main>

<script>
const $ = id => document.getElementById(id);
const connEl = $("conn"), connTxt = connEl.querySelector(".txt");
const stage = $("stage"), toggle = $("toggle"), tLab = $("tLab"), tSub = $("tSub");
const lvlRing = $("lvl"), msg = $("msg"), warn = $("warn");
const RING = 2 * Math.PI * 52; // 326.7

if (!window.isSecureContext) {
  warn.hidden = false;
  warn.textContent = "⚠ Not a secure context — the browser will block the mic. Open via an https:// address or http://localhost.";
}

let ws = null, ctx = null, stream = null, node = null, src = null;
let started = false, socketOpen = false, on = false, userStopped = true;
let backoff = 500, reconnTimer = null, pingTimer = null;
let peak = 0, shown = 0;
let reachable = true;               // optimistic; flipped false only on a genuine connection failure

let connKey = "";
function setConn(state, text) {
  const t = text || state, k = state + "|" + t;
  if (k === connKey) return;        // idempotent — safe to call every animation frame
  connKey = k;
  connEl.className = "conn " + state;
  connTxt.textContent = t;
  stage.dataset.state = state;      // drives ring + button colors to match
}
function setMsg(t, err) { msg.textContent = t; msg.classList.toggle("err", !!err); }

// ── single source of truth for the connection badge ──
//   not pressed         → green "connected" (idle; no live socket, we present as connected)
//   pressed + reachable → blue  "streaming" (mic active, regardless of audio level)
//   pressed + failed    → red   "offline"   (genuinely cannot reach the server)
function applyState() {
  if (!on) return setConn("connected", "connected");
  if (reachable) return setConn("streaming", "streaming");
  setConn("offline", "offline");
}

// ── audio graph (acquired once, kept alive) ──
async function ensureAudio() {
  if (started) return true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) { setMsg("mic blocked: " + e.message, true); return false; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.audioWorklet.addModule("worklet.js");
  src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "pcm-worklet");
  node.port.onmessage = (e) => {
    if (on && ws && ws.readyState === 1) ws.send(e.data);
    const v = new Int16Array(e.data);
    let p = 0;
    for (let i = 0; i < v.length; i++) { const a = v[i] < 0 ? -v[i] : v[i]; if (a > p) p = a; }
    peak = p / 32768;
  };
  src.connect(node);
  node.connect(ctx.destination);
  await ctx.resume();
  started = true;
  return true;
}

// ── websocket (persistent, auto-reconnect while streaming) ──
function connect() {
  if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
  clearTimeout(reconnTimer);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    socketOpen = true; backoff = 500; reachable = true;
    ws.send(JSON.stringify({ type: "config", sampleRate: ctx ? ctx.sampleRate : 48000, channels: 1 }));
    applyState();
    setMsg((ctx ? Math.round(ctx.sampleRate / 1000) : 48) + " kHz · live");
    startPing();
  };
  ws.onmessage = () => {};
  ws.onclose = () => {
    socketOpen = false; stopPing();
    if (userStopped) { applyState(); return; }   // normal stop → green (button released)
    reachable = false; applyState();             // unexpected drop → red until we reconnect
    reconnTimer = setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 5000);
  };
  ws.onerror = () => { reachable = false; applyState(); try { ws.close(); } catch {} };
}
function startPing() {
  stopPing();
  pingTimer = setInterval(() => {
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify({ type: "ping", t: Date.now() })); } catch {} }
  }, 4000);
}
function stopPing() { clearInterval(pingTimer); pingTimer = null; }

function refresh() {
  stage.classList.toggle("live", on);
  tLab.textContent = on ? "STOP" : "START";
  tSub.textContent = on ? "streaming — tap to stop" : "tap to stream mic";
  toggle.setAttribute("aria-pressed", String(on));
}

async function start() {
  userStopped = false;
  if (!(await ensureAudio())) { userStopped = true; return; }
  on = true; reachable = true;
  applyState();                 // pressed → blue immediately (mic is active)
  if (!socketOpen) connect();
  setMsg("streaming…");
  refresh();
}
function stop() {
  on = false; userStopped = true;
  setMsg("idle");
  stopPing();
  if (ws) { try { ws.close(); } catch {} }
  applyState();                 // released → green "connected"
  refresh();
}

toggle.addEventListener("click", () => { on ? stop() : start(); });

// ── level meter ──
function tick() {
  const target = on ? peak : peak * 0.5;
  shown += (target - shown) * (target > shown ? 0.5 : 0.12);
  const frac = Math.min(1, shown * 1.6);
  lvlRing.setAttribute("stroke-dashoffset", (RING * (1 - frac)).toFixed(1));
  peak *= 0.9;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
refresh();
applyState();   // idle on load → green "connected"
</script>
</body>
</html>
