[plugin]
name = "dsh"
version = "0.2.0"

[[service]]
name = "dsh"

[[tool]]
name = "dsh"
major = 1
tier = "off"

[[tool]]
name = "harness-ds"
major = 1
tier = "off"
implements = ["harness@1"]

[[page]]
name = "dsh"
dir = "pages/dsh/dist"

[needs]
secrets = ["AWM_APPROVER_GRANT_PUBKEY"]  # the mesh front's passkey sign-in (awm.tlsfront.portal)
network = ["openrouter.ai", "github.com", "api.github.com"]
platform = ["linux"]

[[needs.tool]]
name = "reflection"   # dsh sends it harness_event
major = 1
verbs = ["harness_event"]

[[needs.tool]]
name = "auth"         # the mesh front's edge session check (awm.tlsfront.auth)
major = 1
verbs = ["edge_material"]
