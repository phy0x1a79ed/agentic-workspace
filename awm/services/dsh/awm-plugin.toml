[plugin]
name = "dsh"
version = "0.2.0"
trust = "own"

[[service]]
name = "dsh"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "dsh"
major = 1
service = "dsh"
tier = "off"

[[tool]]
name = "harness-ds"
major = 1
service = "dsh"
tier = "off"
implements = ["harness@1"]

[needs]
platform = ["linux"]

[[needs.tool]]
name = "reflection"   # reflection: dsh sends it harness_event
major = 1
