[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-dsh"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM dsh service: supervise the DeepSeek Harness web server on loopback and put an authenticated TLS front on the mesh in front of its GUI."
dependencies = [
    "awm-config",
    "awm-gatewayclient",
    # Service-on-service: the mesh front is a configuration of httpsfront's
    # cert handling, auth gate and reverse proxy, not a second implementation.
    "awm-httpsfront",
    "PyYAML",
]

[project.optional-dependencies]
test = [
    "pytest",
]

# PEP 420 namespace package: no top-level awm/__init__.py; the namespace dir is awm/dsh/.
[tool.setuptools.packages.find]
include = ["awm.dsh*"]
namespaces = true

[tool.pytest.ini_options]
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
]
