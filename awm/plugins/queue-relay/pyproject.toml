[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-queuerelay"
version = "0.1.0"
requires-python = ">=3.11"
description = "The queue tool on every node: outbox to alcor's task store and spawn orders (fleet.md R106)."
dependencies = ["httpx>=0.27", "awm-grantlib>=1,<2"]

[tool.setuptools.packages.find]
include = ["awm.queuerelay*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
