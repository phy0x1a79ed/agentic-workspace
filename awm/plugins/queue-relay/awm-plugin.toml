# The queue tool on every node (fleet.md R106 items 1 and 6): forwards to alcor's store,
# keeps an outbox while alcor is away, and starts the spawn orders alcor signs for this node.
[plugin]
name = "queue-relay"
version = "0.1.0"
trust = "own"

[placement]
nodes = ["*"]

[[service]]
name = "queue-relay"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "queue"
uuid = "8dc4be34-fb94-4d70-8458-8b5dcf09895c"
major = 1
service = "queue-relay"
tier = "on"

[needs]
secrets = ["AWM_APPROVER_GRANT_PUBKEY"]
network = ["alcor"]

[[needs.tool]]   # queue-store on alcor
uuid = "d38d79bf-4752-445d-a17f-ff90ecbc1425"
major = 1

[[needs.tool]]   # approver, for order_pull and order_done
uuid = "0db78f30-1121-416b-83e2-4fb162e134be"
major = 1

[[needs.tool]]   # reflection, to start a spawned session here
uuid = "550c10ed-c2cb-5175-acfa-b17e97b52d6c"
major = 1
