[plugin]
name = "channel"
version = "0.2.0"

[[service]]
name = "channel"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "channel"
major = 1
service = "channel"
tier = "on"

[needs]
secrets = ["AWM_TETHER_ISSUE_TOKEN"]
network = ["nexus.tony-xy-liu.com", "github.com", "*.githubusercontent.com"]
platform = ["linux"]

# reflection, through awm.gatewayclient.holders and push: `session_of` and
# `list_other` name the holder and tell when it is gone, and `message` pushes
# each line into its prompt.
[[needs.tool]]
name = "reflection"
major = 1
verbs = ["list_other", "session_of", "message"]

