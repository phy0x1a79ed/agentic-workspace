[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-channel"
version = "0.2.0"
requires-python = ">=3.11"
description = "AWM channel plugin: rooms and machines through the tether, pushed into the holding session."
dependencies = [
    "awm-gatewayclient",
    "httpx",
    "cryptography",
    "spake2>=0.9",
]

# PEP 420 namespace package: no top-level awm/__init__.py.
[tool.setuptools.packages.find]
include = ["awm.channel*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
    "integration: runs a tether relay binary; slower",
]
