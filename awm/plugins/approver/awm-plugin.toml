# The approver singleton (fleet.md R97, queue.md R64 and R65). It authorizes every action
# Tony takes on the board, signs grants and orders, and serves the passkey panel on its own origin.
[plugin]
name = "approver"
version = "0.1.0"
trust = "own"

[placement]
nodes = ["alcor"]

[[service]]
name = "approver"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "approver"
uuid = "0db78f30-1121-416b-83e2-4fb162e134be"
major = 1
service = "approver"
tier = "off"

[[page]]
name = "panel"
path = "/panel"

[needs]
# AWM_QUEUE_ACTION_SECRET is shared with queue-store alone. The keys live in AWM_APPROVER_DIR.
secrets = ["AWM_QUEUE_ACTION_SECRET"]
network = ["deneb"]

[[needs.tool]]   # queue-store, for card actions and approval cards
uuid = "d38d79bf-4752-445d-a17f-ff90ecbc1425"
major = 1

[[needs.tool]]   # 2fa, for the strip on the panel (R137)
uuid = "892549fc-e262-5e5e-b420-c69134c77945"
major = 1
