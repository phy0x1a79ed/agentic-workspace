[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-approver"
version = "0.1.0"
requires-python = ">=3.11"
description = "alcor's approver: passkeys, the device chain, grants, orders and the action panel (fleet.md R97, queue.md R64, R65)."
dependencies = ["awm-grantlib", "cryptography>=42", "webauthn>=2.2", "fastapi>=0.110",
                "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
awm-approver = "awm.approver.cli:main"

[tool.setuptools.packages.find]
include = ["awm.approver*"]
namespaces = true

[tool.setuptools.package-data]
"awm.approver" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
