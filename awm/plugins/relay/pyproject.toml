[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-relay"
version = "0.1.0"
requires-python = ">=3.11"
description = "AWM relay plugin: the host half of the channel rooms, on the public host beside the tether relay."
dependencies = [
    "awm-gatewayclient",
    "awm-tether",
    "httpx",
]

# PEP 420 namespace package: no top-level awm/__init__.py.
[tool.setuptools.packages.find]
include = ["awm.relay*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "smoke: fast unit tests; target <30s",
    "unit: pure unit tests, no network or subprocesses",
    "integration: runs a tether relay binary; slower",
]
