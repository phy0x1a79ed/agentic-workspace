[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-taskqueue"
version = "0.1.0"
requires-python = ">=3.11"
description = "The fleet's one task store and its Trilium board writer (fleet.md R106, queue.md R61-R66)."
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["awm.taskqueue*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["trilium: needs the local Trilium container (tests/trilium-up.sh)"]
