# operations (queue.md R145): the task queue, the approver and request_human under one tool.
# The relay runs on every node. On the home node (alcor) the same service also runs the
# store, the approver with its panel origin, the board writer and the singleton door.
[plugin]
name = "operations"
version = "0.2.0"

[[service]]
name = "operations"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "operations"
major = 2
service = "operations"
tier = "on"

[needs]
# Every node: the door key into alcor's singleton door (fleet.md R98 item 2) and alcor's
# grant key, to check spawn orders. The approver's own keys live in AWM_APPROVER_DIR.
secrets = ["AWM_OPERATIONS_DOOR_KEY", "AWM_APPROVER_GRANT_PUBKEY"]
network = ["alcor"]

[[needs.tool]]   # the calling session, start_other for spawns, join notices
name = "reflection"
major = 1
verbs = ["session_of", "message", "start_other"]

[[needs.tool]]   # the urgent DM and the Arbutus approval thread
name = "social"
major = 1
verbs = ["send"]

[[needs.tool]]   # on alcor: the panel's 2fa strip (R137)
name = "2fa"
major = 1
verbs = ["burst", "approve_all", "approve", "deny", "devices", "pending"]

[[needs.tool]]   # on deneb: the board's cards and the spawn body check (fleet.md R105)
name = "trilium"
major = 1
verbs = ["note_get", "note_create", "note_update", "attr_delete", "attr_set", "note_children", "note_delete"]

