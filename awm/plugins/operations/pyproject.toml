[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-operations"
version = "0.2.0"
requires-python = ">=3.11"
description = "The operations plugin: task queue, approver, passkey panel and request_human (queue.md R145)."
dependencies = ["awm-grantlib", "cryptography>=42", "webauthn>=2.2", "fastapi>=0.110",
                "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
awm-operations = "awm.operations.cli:main"

[tool.setuptools.packages.find]
include = ["awm.operations*"]
namespaces = true

[tool.setuptools.package-data]
"awm.operations" = ["board/*.html", "board/*.js"]
"awm.operations.approver" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["trilium: needs the local Trilium container (tests/trilium-up.sh)", "unit", "smoke"]
