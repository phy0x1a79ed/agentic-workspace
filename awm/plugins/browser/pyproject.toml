[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm-browser-seats"
version = "0.1.0"
requires-python = ">=3.11"
description = "The browser singleton: a Chrome window per attached session (fleet.md R102)."
dependencies = ["httpx>=0.27", "websockets>=12"]

[tool.setuptools.packages.find]
include = ["awm.browser_seats*"]
namespaces = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
