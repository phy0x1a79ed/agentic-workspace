# The browser singleton (fleet.md R102): one Chrome with Tony's profile and the
# service window, a window per attached session, one viewer for all of them.
# Which node runs it is node config: edges.yml names the host (R140).
[plugin]
name = "browser"
version = "0.1.0"
trust = "own"

[[service]]
name = "browser"
path = "."
run = "run.sh"
install = "install.sh"

[[tool]]
name = "browser"
uuid = "03b15432-96bf-4f34-abed-9bb5623ceea0"
major = 1
service = "browser"
tier = "on"

[[needs.tool]]   # approver, for captcha and sign-in requests (R102 item 7)
uuid = "0db78f30-1121-416b-83e2-4fb162e134be"
major = 1
