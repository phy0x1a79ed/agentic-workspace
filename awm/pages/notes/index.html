<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <!-- Apply the saved theme before first paint so a manual light/dark choice
         doesn't flash the OS default (@media) on load. Absent = follow the OS. -->
    <script>
      try {
        var t = localStorage.getItem('notes_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
