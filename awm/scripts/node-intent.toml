# Deliberate differences between awm nodes, read by node-diff.sh.
#
# A table per node maps "<layer>:<item>" to the reason the item exists on that
# node and not on the peer it is compared with. [differs] maps an item present
# on both nodes with different content. Keys are fnmatch globs, but keep each
# one to a single item or a name family: a broad glob hides the next real gap.
# node-probe.sh prints the layers and items.
#
# Record a difference here when it is deliberate. Fix it instead when it is not.

