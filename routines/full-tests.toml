[routine]
name = "full-tests"
description = "Run every dist's tests on the checked-out release. Fail only on a dist that newly fails."

[trigger]
timer = "*-*-* 03:30:00"

[[step]]
name = "suite"
run = "scripts/full-tests.sh"
timeout = 7200

[fixer]
scope = "fix-full-tests"
prompt = """Fix the newly failing dists on a feature branch and land it with `routine deploy`. \
.awm/full-tests/last.log holds the full run."""
