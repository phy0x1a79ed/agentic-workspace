[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "httpx",
    "mcp[cli]",
    "pyyaml",
    "websockets",
    "discord.py>=2.3",
]

[tool.setuptools.packages.find]
include = ["awm*"]

[tool.setuptools.package-data]
"awm.skills" = ["**/*.md", "**/*.template"]
"awm.static" = ["*.html", "*.css", "*.js"]
"awm.services" = ["_room_names_data/*.txt"]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "httpx",
    "mcp[cli]",
]

[project.scripts]
awm = "awm.__main__:main"
awm-mcp = "awm.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["awm/tests"]
asyncio_mode = "auto"
markers = [
    "smoke: fast unit + tiny in-process tests; target <30s, run on every dev iteration",
    "slow: spawns subprocesses, real git, or network simulation; excluded from smoke",
    "federation: peer / replication / leadership state machine",
    "subprocess: spawns child processes (git, mcp, supervised hub backends)",
    "unit: pure unit tests (DB layer, models, validation, registries)",
    "hub: hub routing / stripes / static / passthrough",
    "scopes: scope CRUD + git worktree",
    "messaging: rooms / messages / posts / control plane",
    "auth: login / exposed app / auth service",
    "mcp: mcp server / exports / cli context emit",
    "artifacts: artifact registry + federation",
    "sessions: session log / history",
    "agent: agent instances / vagrant sessions",
    "misc: outliers (skills, locks, voice config, ssh tunnel)",
]
