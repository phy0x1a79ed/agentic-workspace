[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tony X. Liu", email = "contacttonyliu@gmail.com" },
    { name = "Opal 0x1a79ed", email = "phyberosis0x1a79ed@gmail.com" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "httpx",
    "mcp[cli]",
    "pyyaml",
    "websockets",
    "discord.py>=2.3",
]

[tool.setuptools.packages.find]
include = ["awm*"]

[tool.setuptools.package-data]
"awm.skills" = ["**/*.md", "**/*.template"]
"awm.static" = ["*.html", "*.css", "*.js"]
"awm.services" = ["_room_names_data/*.txt"]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "httpx",
    "mcp[cli]",
]

[project.scripts]
awm = "awm.__main__:main"
awm-mcp = "awm.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["awm/tests"]
asyncio_mode = "auto"
