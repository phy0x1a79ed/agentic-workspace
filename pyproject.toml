[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typer",
    "httpx",
    "mcp[cli]",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["awm*"]

[tool.setuptools.package-data]
"awm.skills" = ["**/*.md", "**/*.template"]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "httpx",
]

[project.scripts]
awm = "awm.__main__:main"
awm-mcp = "awm.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["awm/tests"]
