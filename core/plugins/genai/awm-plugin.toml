# Media generation (genai): jobs over providers, in named styles kept in Trilium.
# A singleton (the fleet's edges.yml names its host and callers), because it holds the one Muse
# room on its host's channel.
[plugin]
name = "genai"
version = "0.1.0"

[[service]]
name = "genai"
run = "run.sh"

[[tool]]
name = "genai"
major = 1
service = "genai"
tier = "on"

[needs]
platform = ["linux"]
