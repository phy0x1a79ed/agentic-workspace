[package]
name = "awm-plugin-mic"
description = "The remote microphone: a phone's browser audio piped into the PulseAudio virtmic sink, which mic keeps alive."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mic"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-pycompat.workspace = true
awm-statecheck = { path = "../../crates/awm-statecheck" }
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
