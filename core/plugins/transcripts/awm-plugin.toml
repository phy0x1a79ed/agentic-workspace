[plugin]
name = "transcripts"
version = "0.2.0"

[[service]]
name = "transcripts"
path = "."
run = "run.sh"

[[service.archive]]
name = "transcripts"
mode = "live"
query = "transcripts_query"
optin = true
hit = ["title", "ts"]

[service.archive.fields]
title = "content"
text = "content"
ts = "datetime"
project = "categorical"
scope = { class = "categorical", nested = "/" }

[[tool]]
name = "transcripts"
major = 1
tier = "off"

[needs]
secrets = []
network = []
platform = ["linux"]
