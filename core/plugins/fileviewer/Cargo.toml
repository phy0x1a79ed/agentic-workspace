[package]
name = "awm-plugin-fileviewer"
description = "The fileviewer plugin: serves a file by its absolute path at /s/fileviewer/, with its Content-Type, behind a mask that hides secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "fileviewer"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-statecheck = { path = "../../crates/awm-statecheck" }
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
futures-util.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
