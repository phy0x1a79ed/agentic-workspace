[package]
name = "awm-plugin-auth"
description = "The auth plugin: device tokens, the edge session secret, and the node's TLS front (the former httpsfront and tlsfront)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "auth"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-trust.workspace = true
awm-statecheck = { path = "../../crates/awm-statecheck" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
libc.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
subtle = "2"
rand = "0.8"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
x509-parser = "0.16"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
regex = "1"
awm-pycompat.workspace = true
unicode-normalization = "0.1"
time = "0.3"
ring = "0.17"
awm-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
ed25519-dalek = "2"
