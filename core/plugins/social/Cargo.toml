[package]
name = "awm-plugin-social"
description = "The bot chat accounts and the queue each seat host pulls."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "social"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-chat = { path = "../../crates/awm-chat" }
awm-statecheck = { path = "../../crates/awm-statecheck" }
awm-trust.workspace = true
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["multipart", "stream"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml.workspace = true
tracing.workspace = true
twilight-gateway.workspace = true
twilight-http.workspace = true
twilight-model.workspace = true
twilight-util.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
urlencoding.workspace = true
axum.workspace = true
