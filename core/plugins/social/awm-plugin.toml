# The bot chat accounts (Slack, Discord) and which node each seated chat belongs to.
# Each seat host's `seats` plugin pulls its lines.
[plugin]
name = "social"
version = "0.2.0"

[[service]]
name = "social"
run = "run.sh"

[[tool]]
name = "social"
major = 1
service = "social"
tier = "on"

[needs]
network = ["slack.com", "*.slack.com", "*.slack-edge.com", "discord.com", "*.discord.com", "*.discord.gg", "*.discordapp.com", "*.discordapp.net"]
platform = ["linux"]

# A hand mount off the seat hosts is told and checked through reflection.
[[needs.tool]]
name = "reflection"
major = 1
verbs = ["message", "list_other", "session_of"]
