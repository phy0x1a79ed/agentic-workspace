# Chat accounts (Slack, Discord, Gmail), cloud buckets (Google Drive), and the
# seats: every message in a seated chat goes to that chat's agent, which social
# starts on the seat's node through reflection.
[plugin]
name = "social"
version = "0.2.0"

[[service]]
name = "social"
run = "run.sh"

[[tool]]
name = "social"
major = 1
service = "social"
tier = "on"

[needs]
network = ["slack.com", "*.slack.com", "*.slack-edge.com", "discord.com", "*.discord.com", "*.discord.gg", "*.discordapp.com", "*.discordapp.net", "imap.gmail.com:993", "smtp.gmail.com:465", "www.googleapis.com", "oauth2.googleapis.com"]
platform = ["linux"]

# A seat's agent is started, told and checked through reflection.
[[needs.tool]]
name = "reflection"
major = 1
verbs = ["message", "list_other", "session_of", "start_other"]
