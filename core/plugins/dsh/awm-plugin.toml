[plugin]
name = "dsh"
version = "0.3.0"

[[service]]
name = "dsh"

# The harness's Origin-equals-Host fence is why the front rewrites Origin.
[[service.front]]
port = 12130
upstream = "http://127.0.0.1:12311"
rewrite_origin = true

[[tool]]
name = "dsh"
major = 1
tier = "off"

[[tool]]
name = "harness-ds"
major = 1
tier = "off"
implements = ["harness@1"]

[[page]]
name = "dsh"
dir = "pages/dsh/dist"

[needs]
secrets = []
network = ["openrouter.ai", "github.com", "api.github.com"]
platform = ["linux"]
