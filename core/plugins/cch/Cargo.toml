[package]
name = "awm-plugin-cch"
description = "The cch plugin: serves harness@1 over Claude Code sessions as `harness-cc`."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "cch"
path = "src/lib.rs"

[[bin]]
name = "cch"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-harness = { workspace = true, features = ["claude"] }
anyhow.workspace = true
awm-statecheck = { path = "../../crates/awm-statecheck" }
chrono.workspace = true
clap.workspace = true
libc.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
