[package]
name = "awm-plugin-dvc"
description = "The dvc plugin: the chinook Globus remote for the shared DVC cache, its two backup jobs, and the scope data verbs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dvc"
path = "src/main.rs"

[dependencies]
awm-plugin-sdk.workspace = true
awm-dvcdata = { path = "../../crates/awm-dvcdata" }
awm-statecheck = { path = "../../crates/awm-statecheck" }
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
# The same rusqlite as awm-statecheck, so the workspace links one SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
