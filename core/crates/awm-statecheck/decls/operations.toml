# operations (port T11). Relative paths resolve against AWM_DIR. The queue and relay databases
# default to ~/.awm/operations, which on alcor is /var/lib/awm/operations/.awm/operations.
dirs = [
    "${HOME}/.awm/operations",
    "${AWM_APPROVER_DIR:-${HOME}/.awm/approver}",
]

# The Arbutus pending copies sit behind the admin gate: recorded, never copied.
[[size_only]]
path = "${AWM_APPROVAL_PENDING:-${HOME}/.ssh/admin-approvals/pending}"

[[additive]]
path = "${HOME}/.awm/operations/queue.db"
table = "tasks"
column = "body"

[[additive]]
path = "${HOME}/.awm/operations/queue.db"
table = "ops_notes"

[[transient]]
path = "${HOME}/.awm/operations/relay.db"
table = "outbox"

[[transient]]
path = "${HOME}/.awm/operations/relay.db"
table = "seen_orders"

[[transient]]
path = "${HOME}/.awm/operations/relay.db"
table = "cache"
