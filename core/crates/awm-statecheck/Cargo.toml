[package]
name = "awm-statecheck"
description = "The pre-redux state check: snapshot a plugin's state once before its first Rust start, inventory it, check it, and restore on proven damage."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
clap.workspace = true
libc.workspace = true
glob = "0.3"
# The same rusqlite as awm-store, so the workspace links one SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
sha2 = "0.10"
hex = "0.4"
