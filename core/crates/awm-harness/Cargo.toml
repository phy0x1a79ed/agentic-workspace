[package]
name = "awm-harness"
description = "What a harness plugin shares: the harness@1 contract types and events, and what awm knows about Claude Code's background sessions."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["claude"]
claude = ["dep:chrono", "dep:libc", "dep:sha2"]

[dependencies]
awm-plugin-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
