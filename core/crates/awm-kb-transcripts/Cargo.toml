[package]
name = "awm-kb-transcripts"
description = "Claude Code session logs inside kb: the gzipped archive at ~/.claude/projects-archive, its daily sweep, and the `transcripts` search source over a full-text LanceDB index of the archive."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
awm-embed.workspace = true
awm-plugin-sdk.workspace = true
awm-pycompat.workspace = true
awm-store.workspace = true
awm-index.workspace = true
awm-kb-source = { path = "../awm-kb-source" }
anyhow.workspace = true
futures-util.workspace = true
lancedb = { version = "0.41", default-features = false }
fancy-regex = "0.17"
flate2 = "1"
libc.workspace = true
regex = "1"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
flate2 = "1"
