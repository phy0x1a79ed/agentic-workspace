[workspace]
resolver = "2"
# crates/* and plugins/*, as one glob: cargo reads a glob that matches nothing as a literal
# path, so a separate "plugins/*" fails while core/plugins is empty or missing.
members = ["[cp]*/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.26"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
libc = "0.2"
tempfile = "3"
base64 = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
# The room crypto, the suite the tether how-to names: spake2 0.4, HKDF-SHA256, ChaCha20-Poly1305.
spake2 = "0.4"
hkdf = "0.12"
chacha20poly1305 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
rand = "0.9"

awm-proto = { path = "crates/awm-proto" }
awm-gateway = { path = "crates/awm-gateway" }
awm-mcp = { path = "crates/awm-mcp" }
awm-cli = { path = "crates/awm-cli" }
awm-trust = { path = "crates/awm-trust" }
awm-edge = { path = "crates/awm-edge" }
awm-plugin-sdk = { path = "crates/awm-plugin-sdk" }
awm-cdp = { path = "crates/awm-cdp" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
